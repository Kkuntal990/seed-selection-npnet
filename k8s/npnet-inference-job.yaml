apiVersion: batch/v1
kind: Job
metadata:
  name: npnet-inference
  labels:
    app: npnet
    stage: inference
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: npnet
        stage: inference
    spec:
      restartPolicy: OnFailure
      containers:
        - name: generator
          image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-devel
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash"]
          args:
          - "-c"
          - |
            set -e

            echo "=== Installing dependencies ==="
            apt-get update && apt-get install -y git
            git clone https://github.com/Kkuntal990/seed-selection-npnet.git /workspace/repo
            cd /workspace/repo && pip install --root-user-action=ignore --no-cache-dir ./seed-mining ./npnet
            echo "=== Dependencies installed ==="

            echo "========================================="
            echo "NPNet — Golden Noise Inference"
            echo "Model: ${MODEL_ID}"
            echo "Checkpoint: ${NPNET_CHECKPOINT}"
            echo "Seeds: ${SEED_START}..$(( SEED_START + SEED_RANGE - 1 ))"
            echo "========================================="

            nvidia-smi

            echo "Starting golden noise image generation..."
            cd /workspace/repo/npnet && python scripts/generate_golden_noise.py \
              --model_id "${MODEL_ID}" \
              --npnet_checkpoint "${NPNET_CHECKPOINT}" \
              --prompt_dataset_dir "${PROMPT_DATASET_DIR}" \
              --split "${SPLIT}" \
              --num_objects "${NUM_OBJECTS}" \
              --num_settings "${NUM_SETTINGS}" \
              --num_inference_steps "${NUM_INFERENCE_STEPS}" \
              --guidance_scale "${GUIDANCE_SCALE}" \
              --seed_start "${SEED_START}" \
              --seed_range "${SEED_RANGE}" \
              --height "${HEIGHT}" \
              --width "${WIDTH}" \
              --out_dir "${OUTPUT_DIR}" \
              --image_format "${IMAGE_FORMAT}"

          resources:
            requests:
              cpu: "4"
              memory: "32Gi"
              nvidia.com/rtxa6000: "1"
            limits:
              cpu: "8"
              memory: "48Gi"
              nvidia.com/rtxa6000: "1"

          volumeMounts:
          - name: cache-volume
            mountPath: /cache
          - name: output
            mountPath: /output
          - name: dev-shm
            mountPath: /dev/shm

          env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
                optional: true
          - name: HF_HOME
            value: "/cache/hf"
          - name: TRANSFORMERS_CACHE
            value: "/cache/hf/transformers"

          # Inference config
          - name: MODEL_ID
            value: "stabilityai/stable-diffusion-xl-base-1.0"
          - name: NPNET_CHECKPOINT
            value: "/output/npnet_checkpoints/npnet_best.pth"
          - name: PROMPT_DATASET_DIR
            value: "/workspace/repo/seed-mining/prompt_dataset"
          - name: SPLIT
            value: "train"
          - name: NUM_OBJECTS
            value: "15"
          - name: NUM_SETTINGS
            value: "4"
          - name: NUM_INFERENCE_STEPS
            value: "50"
          - name: GUIDANCE_SCALE
            value: "5.5"
          - name: SEED_START
            value: "0"
          - name: SEED_RANGE
            value: "100"
          - name: HEIGHT
            value: "1024"
          - name: WIDTH
            value: "1024"
          - name: OUTPUT_DIR
            value: "/output/golden_output"
          - name: IMAGE_FORMAT
            value: "jpg"

          - name: PYTHONUNBUFFERED
            value: "1"
          - name: PYTORCH_CUDA_ALLOC_CONF
            value: "expandable_segments:True"

      tolerations:
      - effect: NoSchedule
        key: nautilus.io/hardware
        operator: Equal
        value: large-gpu
      - effect: PreferNoSchedule
        key: nvidia.com/gpu
        operator: Exists
      - key: nautilus.io/reservation
        operator: Exists
        effect: NoSchedule
      - key: nautilus.io/issue
        operator: Exists
        effect: NoSchedule

      volumes:
      - name: output
        persistentVolumeClaim:
          claimName: seed-mining-output
      - name: cache-volume
        emptyDir:
          sizeLimit: 100Gi
      - name: dev-shm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
