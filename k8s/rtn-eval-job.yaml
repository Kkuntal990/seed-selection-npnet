apiVersion: batch/v1
kind: Job
metadata:
  name: rtn-eval
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: ece271b
        task: rtn-evaluation
        model: qwen2-1.5b
    spec:
      restartPolicy: OnFailure

      containers:
      - name: rtn-runner
        image: ghcr.io/kkuntal990/seed-mining:latest
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "=== Installing dependencies ==="
          apt-get update && apt-get install -y build-essential
          pip install -U pip setuptools wheel
          pip install -U torch transformers accelerate bitsandbytes datasets evaluate \
            optimum pandas pyarrow matplotlib seaborn pyyaml safetensors scipy scikit-learn
          echo "=== Dependencies installed ==="
          echo "=== Running RTN pipeline ==="
          cd /output && python /app/scripts/run_rtn.py
          echo "=== RTN pipeline complete ==="

        resources:
          requests:
            nvidia.com/rtxa6000: "1"
            memory: "32Gi"
            cpu: "4"
          limits:
            nvidia.com/rtxa6000: "1"
            memory: "32Gi"
            cpu: "8"

        volumeMounts:
        - name: cache-volume
          mountPath: /cache
        - name: output
          mountPath: /output
        - name: dev-shm
          mountPath: /dev/shm

        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true
        - name: HF_HOME
          value: "/cache/hf"
        - name: TRANSFORMERS_CACHE
          value: "/cache/hf/transformers"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"

      tolerations:
      - effect: NoSchedule
        key: nautilus.io/hardware
        operator: Equal
        value: large-gpu
      - effect: PreferNoSchedule
        key: nvidia.com/gpu
        operator: Exists
      - key: nautilus.io/reservation
        operator: Exists
        effect: NoSchedule
      - key: nautilus.io/issue
        operator: Exists
        effect: NoSchedule

      volumes:
      - name: cache-volume
        emptyDir:
          sizeLimit: 150Gi
      - name: output
        persistentVolumeClaim:
          claimName: seed-mining-output
      - name: dev-shm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
