apiVersion: batch/v1
kind: Job
metadata:
  name: seed-mining-sd35-50
  labels:
    app: seed-mining
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: seed-mining
        task: image-generation
        model: sd35-medium
    spec:
      restartPolicy: OnFailure
      containers:
        - name: generator
          image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-devel
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash"]
          args:
          - "-c"
          - |
            set -e

            echo "=== Installing dependencies ==="
            apt-get update && apt-get install -y git
            git clone https://github.com/Kkuntal990/seed-selection-npnet.git /workspace/repo
            cd /workspace/repo && pip install --root-user-action=ignore --no-cache-dir ./seed-mining
            echo "=== Dependencies installed ==="

            echo "========================================="
            echo "Seed Mining — Image Generation (1 GPU)"
            echo "Model: ${MODEL_ID}"
            echo "Seeds: ${SEED_START}..$(( SEED_START + SEED_RANGE - 1 ))"
            echo "========================================="

            nvidia-smi

            echo "Starting image generation..."
            cd /workspace/repo/seed-mining && python scripts/generate_seed_mining_images.py \
              --model_id "${MODEL_ID}" \
              --out_dir "${OUTPUT_DIR}" \
              --seed_start "${SEED_START}" \
              --seed_range "${SEED_RANGE}" \
              --height "${HEIGHT}" \
              --width "${WIDTH}" \
              --num_inference_steps "${NUM_INFERENCE_STEPS}" \
              --guidance_scale "${GUIDANCE_SCALE}" \
              --batch_size "${BATCH_SIZE}" \
              --generator_device "${GENERATOR_DEVICE}" \
              --image_format "${IMAGE_FORMAT}"

          resources:
            requests:
              cpu: "4"
              memory: "32Gi"
              nvidia.com/rtxa6000: "1"
            limits:
              cpu: "4"
              memory: "36Gi"
              nvidia.com/rtxa6000: "1"

          volumeMounts:
          - name: cache-volume
            mountPath: /cache
          - name: output
            mountPath: /output
          - name: dev-shm
            mountPath: /dev/shm

          env:
          # HuggingFace token (required for gated models)
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
                optional: true

          # Cache directories
          - name: HF_HOME
            value: "/cache/hf"
          - name: TRANSFORMERS_CACHE
            value: "/cache/hf/transformers"

          # Model configuration
          - name: MODEL_ID
            value: "stabilityai/stable-diffusion-3.5-medium"
          - name: OUTPUT_DIR
            value: "/output/image_gen_40_to_50"
          - name: SEED_START
            value: "40"
          - name: SEED_RANGE
            value: "10"
          - name: HEIGHT
            value: "1024"
          - name: WIDTH
            value: "1024"
          - name: NUM_INFERENCE_STEPS
            value: "20"
          - name: GUIDANCE_SCALE
            value: "5.0"
          - name: BATCH_SIZE
            value: "4"
          - name: GENERATOR_DEVICE
            value: "cuda"
          - name: IMAGE_FORMAT
            value: "jpg"

          # Python and CUDA settings
          - name: PYTHONUNBUFFERED
            value: "1"
          - name: PYTORCH_CUDA_ALLOC_CONF
            value: "expandable_segments:True"

      tolerations:
      - effect: NoSchedule
        key: nautilus.io/hardware
        operator: Equal
        value: large-gpu
      - effect: PreferNoSchedule
        key: nvidia.com/gpu
        operator: Exists
      - key: nautilus.io/reservation
        operator: Exists
        effect: NoSchedule
      - key: nautilus.io/issue
        operator: Exists
        effect: NoSchedule

      volumes:
      - name: output
        persistentVolumeClaim:
          claimName: seed-mining-output
      - name: cache-volume
        emptyDir:
          sizeLimit: 100Gi
      - name: dev-shm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
