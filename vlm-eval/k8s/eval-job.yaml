apiVersion: batch/v1
kind: Job
metadata:
  name: vlm-eval
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: vlm-eval
        task: vlm-evaluation
        model: qwen2.5vl
    spec:
      restartPolicy: OnFailure

      containers:
      - name: evaluator
        image: ghcr.io/kkuntal990/vlm-eval:latest
        imagePullPolicy: Always
        command: ["/bin/bash"]
        args:
        - "-c"
        - |
          echo "========================================="
          echo "VLM Evaluation — Seed Mining"
          echo "VLM: ${VLM_MODEL_ID}"
          echo "Seeds: ${SEED_START}..$(( SEED_START + SEED_RANGE - 1 ))"
          echo "Num objects: ${NUM_OBJECTS}, Num settings: ${NUM_SETTINGS}"
          echo "========================================="
          echo ""

          # GPU verification
          echo "GPU Status:"
          nvidia-smi
          echo ""

          # Start evaluation
          echo "Starting VLM evaluation..."
          echo ""
          uv run python scripts/run_evaluation.py \
            --vlm_model_id "${VLM_MODEL_ID}" \
            --quantize "${QUANTIZE}" \
            --images_dir "${IMAGES_DIR}" \
            --prompt_dataset_dir "${PROMPT_DATASET_DIR}" \
            --eval_out_dir "${EVAL_OUT_DIR}" \
            --seed_start "${SEED_START}" \
            --seed_range "${SEED_RANGE}" \
            --num_objects "${NUM_OBJECTS}" \
            --num_settings "${NUM_SETTINGS}" \
            --image_format "${IMAGE_FORMAT}" \
            --category "${CATEGORY}"

        resources:
          requests:
            nvidia.com/gpu: "1"
            memory: "32Gi"
            cpu: "4"
          limits:
            nvidia.com/gpu: "1"
            memory: "48Gi"
            cpu: "8"

        volumeMounts:
        - name: cache-volume
          mountPath: /cache
        - name: output
          mountPath: /output
        - name: dev-shm
          mountPath: /dev/shm

        env:
        # HuggingFace token
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true

        # Cache directories
        - name: HF_HOME
          value: "/cache/hf"
        - name: TRANSFORMERS_CACHE
          value: "/cache/hf/transformers"

        # VLM configuration
        - name: VLM_MODEL_ID
          value: "Qwen/Qwen2.5-VL-7B-Instruct"
        - name: QUANTIZE
          value: "4bit"

        # Prompt dataset (baked into container)
        - name: PROMPT_DATASET_DIR
          value: "/app/seed-mining/prompt_dataset"

        # Input/output
        - name: IMAGES_DIR
          value: "/output/image_gen"
        - name: EVAL_OUT_DIR
          value: "/output/eval_results"
        - name: SEED_START
          value: "0"
        - name: SEED_RANGE
          value: "2"
        - name: NUM_OBJECTS
          value: "1"
        - name: NUM_SETTINGS
          value: "1"
        - name: IMAGE_FORMAT
          value: "jpg"
        - name: CATEGORY
          value: "numeracy"

        # Python settings
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"

      tolerations:
      - effect: NoSchedule
        key: nautilus.io/hardware
        operator: Equal
        value: large-gpu
      - effect: PreferNoSchedule
        key: nvidia.com/gpu
        operator: Exists
      - key: nautilus.io/reservation
        operator: Exists
        effect: NoSchedule

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB

      volumes:
      - name: cache-volume
        emptyDir:
          sizeLimit: 100Gi
      - name: output
        persistentVolumeClaim:
          claimName: seed-mining-output
      - name: dev-shm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
