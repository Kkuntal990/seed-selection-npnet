[project]
name = "vlm-eval"
version = "0.1.0"
description = "VLM evaluation and seed ranking for ECE 271B"
requires-python = ">=3.11"
dependencies = [
    "seed-mining",
    "torch>=2.1",
    "transformers>=4.49",
    "qwen-vl-utils>=0.0.8",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "Pillow>=10.0",
    "scipy>=1.11",
    "bitsandbytes>=0.41",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.8",
    "pytest>=8.0",
]

[project.scripts]
vlm-eval = "vlm_eval.cli:eval_run"
vlm-rank = "vlm_eval.cli:eval_rank"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlm_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.uv.sources]
seed-mining = { path = "../seed-mining" }
