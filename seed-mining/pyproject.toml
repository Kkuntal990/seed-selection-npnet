[project]
name = "seed-mining"
version = "0.1.0"
description = "Seed-mining diffusion image generation for ECE 271B"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1",
    "diffusers>=0.30",
    "transformers>=4.36,<=4.45",
    "accelerate>=0.22",
    "safetensors",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "Pillow>=10.0",
    "rich>=13.0",
    "tqdm",
    "numpy",
    "sentencepiece",
    "protobuf",
]

[project.optional-dependencies]
xformers = ["xformers"]
eval = [
    "scipy>=1.11",
    "bitsandbytes>=0.41",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.8",
    "pytest>=8.0",
    "pre-commit>=3.6",
]

[project.scripts]
seed-mining = "seed_mining.cli:main"
seed-mining-eval = "seed_mining.cli_eval:eval_run"
seed-mining-rank = "seed_mining.cli_eval:eval_rank"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seed_mining"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
