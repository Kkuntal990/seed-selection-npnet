apiVersion: batch/v1
kind: Job
metadata:
  name: seed-mining-sd35
  labels:
    app: seed-mining
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: seed-mining
    spec:
      restartPolicy: OnFailure
      containers:
        - name: generator
          image: seed-mining:latest  # Replace with your registry path
          resources:
            requests:
              cpu: "4"
              memory: "32Gi"
              nvidia.com/rtxa6000: "1"
            limits:
              cpu: "6"
              memory: "40Gi"
              nvidia.com/rtxa6000: "1"
          args:
            - "--model_id"
            - "stabilityai/stable-diffusion-3.5-medium"
            - "--out_dir"
            - "/output"
            - "--seed_range"
            - "100"
            - "--height"
            - "1024"
            - "--width"
            - "1024"
            - "--num_inference_steps"
            - "30"
            - "--guidance_scale"
            - "7.5"
            - "--batch_size"
            - "4"
            - "--generator_device"
            - "cpu"
            - "--enable_cpu_offload"
          volumeMounts:
            - name: output
              mountPath: /output
            - name: hf-cache
              mountPath: /root/.cache/huggingface
          env:
            - name: HF_HOME
              value: /root/.cache/huggingface
            - name: TRANSFORMERS_CACHE
              value: /root/.cache/huggingface/hub
      volumes:
        - name: output
          persistentVolumeClaim:
            claimName: seed-mining-output  # Create PVC separately
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache  # Shared HF model cache
