apiVersion: batch/v1
kind: Job
metadata:
  name: seed-mining-sd35-multigpu
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: seed-mining
        task: image-generation
        model: sd35-medium
        gpu: a100
    spec:
      restartPolicy: Never

      containers:
      - name: generator
        image: ghcr.io/kkuntal990/seed-mining:latest
        imagePullPolicy: Always
        command: ["/bin/bash"]
        args:
        - "-c"
        - |
          echo "========================================="
          echo "Seed Mining — Image Generation (${NPROC} GPUs)"
          echo "Model: ${MODEL_ID}"
          echo "Seeds: ${SEED_START}..$(( SEED_START + SEED_RANGE - 1 ))"
          echo "========================================="
          echo ""

          # GPU verification
          echo "GPU Status:"
          nvidia-smi
          echo ""

          # Install missing deps for SD3
          uv pip install sentencepiece protobuf
          echo ""

          # Start generation with accelerate
          echo "Starting multi-GPU image generation..."
          echo ""
          uv run accelerate launch \
            --num_processes "${NPROC}" \
            scripts/generate_seed_mining_images.py \
            --model_id "${MODEL_ID}" \
            --out_dir "${OUTPUT_DIR}" \
            --seed_start "${SEED_START}" \
            --seed_range "${SEED_RANGE}" \
            --height "${HEIGHT}" \
            --width "${WIDTH}" \
            --num_inference_steps "${NUM_INFERENCE_STEPS}" \
            --guidance_scale "${GUIDANCE_SCALE}" \
            --batch_size "${BATCH_SIZE}" \
            --generator_device "${GENERATOR_DEVICE}" \
            --scheduler "${SCHEDULER}" \
            --image_format "${IMAGE_FORMAT}"

        resources:
          requests:
            nvidia.com/gpu: "4"
            memory: "64Gi"
            cpu: "8"
          limits:
            nvidia.com/gpu: "4"
            memory: "96Gi"
            cpu: "16"

        volumeMounts:
        - name: cache-volume
          mountPath: /cache
        - name: outputs-volume
          mountPath: /output
        - name: dev-shm
          mountPath: /dev/shm

        env:
        # HuggingFace token (required for gated models)
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true

        # Cache directories (using ephemeral emptyDir)
        - name: HF_HOME
          value: "/cache/hf"
        - name: TRANSFORMERS_CACHE
          value: "/cache/hf/transformers"
        - name: TORCH_HOME
          value: "/cache/torch"

        # Model configuration
        - name: MODEL_ID
          value: "stabilityai/stable-diffusion-3.5-medium"
        - name: OUTPUT_DIR
          value: "/output"
        - name: SEED_START
          value: "0"
        - name: SEED_RANGE
          value: "100"
        - name: HEIGHT
          value: "1024"
        - name: WIDTH
          value: "1024"
        - name: NUM_INFERENCE_STEPS
          value: "30"
        - name: GUIDANCE_SCALE
          value: "7.5"
        - name: BATCH_SIZE
          value: "16"
        - name: GENERATOR_DEVICE
          value: "cpu"
        - name: SCHEDULER
          value: "ddim"
        - name: IMAGE_FORMAT
          value: "jpg"

        # DDP configuration
        - name: NPROC
          value: "4"

        # Python and CUDA settings
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"
        - name: NCCL_DEBUG
          value: "WARN"
        - name: NCCL_TIMEOUT
          value: "1800"

      tolerations:
      - effect: NoSchedule
        key: nautilus.io/hardware
        operator: Equal
        value: large-gpu
      - effect: PreferNoSchedule
        key: nvidia.com/gpu
        operator: Exists
      - key: nautilus.io/reservation
        operator: Exists
        effect: NoSchedule

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB

      volumes:
      - name: cache-volume
        emptyDir:
          sizeLimit: 100Gi
      - name: outputs-volume
        persistentVolumeClaim:
          claimName: seed-mining-output
      - name: dev-shm
        emptyDir:
          medium: Memory
          sizeLimit: 48Gi
