apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seed-mining-output
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Gi  # ~62k JPGs at ~50KB each ≈ 3GB, but room for full Comp90
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hf-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi  # SD 2.1 model weights ~5GB + buffer
